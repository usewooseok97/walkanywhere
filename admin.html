<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walk Anywhere — 관리자</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" />
  <link rel="stylesheet" href="./css/base.css" />
  <style>
    body { background: var(--dawn); color: var(--dawn-ink); }
    .wrap { width: min(100% - 2.5rem, 60rem); margin: 0 auto; padding: 3rem 0 5rem; }
    h1 { font-family: var(--serif); font-weight: 600; font-size: var(--t-3); margin: 0 0 .3rem; }
    h2 { font-size: var(--t-1); margin: 2rem 0 .8rem; }
    .lede { color: var(--dawn-muted); margin: 0 0 1.5rem; }
    form.login { display: grid; gap: .6rem; max-width: 22rem; }
    label { font-size: var(--t--1); color: var(--dawn-muted); display: grid; gap: .25rem; }
    input { height: 2.7rem; padding: 0 .8rem; border-radius: .6rem; border: 1.5px solid rgba(27, 33, 64, .35); background: #fff; color: var(--dawn-ink); }
    .status { font-size: var(--t--1); min-height: 1.2rem; }
    .status.bad { color: #9b2c2c; }
    .status.ok { color: #1f6b3a; }
    .bar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: var(--t--1); }
    td, th { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid rgba(27, 33, 64, .12); vertical-align: top; }
    th { color: var(--dawn-muted); font-weight: 600; }
    td.msg { white-space: pre-wrap; max-width: 34rem; }
    .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem; }
    .total { border-top: 1.5px solid rgba(27, 33, 64, .25); padding-top: .6rem; }
    .total b { display: block; font-family: var(--serif); font-size: var(--t-2); font-weight: 600; line-height: 1.1; }
    .total span { font-size: var(--t--1); color: var(--dawn-muted); }
    .btn-sm { min-height: 2rem; padding: .2rem .7rem; font-size: .8rem; }
    .empty { color: var(--dawn-muted); }
    .pw { display: grid; gap: .6rem; max-width: 22rem; }
    a { color: var(--dawn-ink); }
    .tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1.5rem 0 0; }
    .tabs a { padding: .35rem .9rem; border-radius: 999px; border: 1px solid rgba(27, 33, 64, .3); text-decoration: none; font-size: var(--t--1); }
    .tabs a:hover { background: rgba(27, 33, 64, .08); }
    .stats section { margin: 1.4rem 0; }
    .stats h3 { font-size: var(--t-0); margin: 0 0 .6rem; }
    .bars { display: grid; gap: .45rem; margin: 0; padding: 0; list-style: none; }
    .bars li { display: grid; grid-template-columns: minmax(8rem, 16rem) 1fr auto; gap: .8rem; align-items: center; font-size: var(--t--1); }
    .bars .bar { height: 10px; border-radius: 5px; background: rgba(27, 33, 64, .12); overflow: hidden; }
    .bars .bar i { display: block; height: 100%; background: var(--lamp-deep); border-radius: 5px; }
    .bars .n { font-variant-numeric: tabular-nums; color: var(--dawn-muted); }
    .foot { font-size: var(--t--1); color: var(--dawn-muted); }
    h2 { scroll-margin-top: 1rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>관리자</h1>
    <p class="lede">불편사항, 통계(어디를 걷고 싶어 하는지·어떤 걸음으로 걷는지·어떤 간판을 누르는지), 사용자를 봅니다. 처음 비밀번호는 <code>admin1234</code> 이고, 로그인한 뒤 꼭 바꿔 주세요.</p>
    <div id="out"></div>
    <p class="lede" style="margin-top:2rem"><a href="/">첫 화면으로</a></p>
  </main>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
