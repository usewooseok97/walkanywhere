<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Walk Anywhere — 오늘은 어디로 가볼까?</title>
  <meta name="description" content="문장 하나로 열리는 세계를 걷는 1인칭 산책. 앱도 장비도 없이 브라우저에서 바로." />
  <meta name="theme-color" content="#151b30" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="walk-canvas" aria-label="1인칭 산책 화면"></canvas>

    <!-- 처음 여는 동안 -->
    <div class="boot" id="boot">
      <div>
        <h1>Walk Anywhere</h1>
        <p id="boot-text">길을 여는 중입니다</p>
        <p class="err" id="boot-err" hidden></p>
      </div>
    </div>

    <div class="hud" id="hud">
      <div class="hud-top">
        <div class="hud-brand">
          <a class="wordmark" href="/about">Walk Anywhere</a>
          <div class="hud-place" id="hud-place">풀숲 길</div>
        </div>
        <div class="hud-actions">
          <button type="button" class="btn btn-glass" id="btn-mute">소리 끄기</button>
          <button type="button" class="btn btn-glass" id="btn-full">전체 화면</button>
          <a class="btn btn-glass" href="/about">소개</a>
        </div>
      </div>

      <div class="hint" aria-hidden="true">
        <span class="hint-free">화면을 클릭하면 마우스로 둘러봅니다</span>
        <span class="hint-locked"><kbd>Esc</kbd> 멈추고 마우스 꺼내기</span>
        <span class="hint-locked"><kbd>Space</kbd> 멈추기와 다시 걷기</span>
        <span class="hint-locked"><kbd>Enter</kbd> 문장 입력</span>
      </div>

      <span class="crosshair" aria-hidden="true"></span>
      <div class="tooltip" id="tooltip" hidden></div>

      <!-- 간판 정보: 무슨 건물일까 -->
      <aside class="place-card" id="place-card" hidden aria-live="polite">
        <p class="eyebrow">무슨 건물일까?</p>
        <h3 id="card-title"></h3>
        <span class="tag" id="card-tag"></span>
        <p id="card-desc"></p>
        <span class="url" id="card-url"></span>
        <div class="row">
          <button type="button" class="btn btn-lamp" id="card-visit">새 탭에서 방문하기</button>
          <button type="button" class="btn btn-ghost" id="card-close">닫기</button>
        </div>
        <p class="note">살펴보는 동안 느긋이 걷습니다. 건물을 다시 클릭해도 열립니다.</p>
      </aside>

      <!-- 하단 이야기 카드 -->
      <section class="story-card" id="story" aria-live="polite">
        <!-- 상태별 내용은 스크립트가 채운다 -->
      </section>

      <!-- 걷기 조작 -->
      <div class="hud-bar">
        <button type="button" class="walk-toggle is-walking" id="btn-walk" aria-pressed="true">
          <span class="walk-icon" aria-hidden="true"></span><span class="walk-label">정지</span>
        </button>
        <div class="speed" role="group" aria-label="걷는 속도">
          <span class="speed-title">걸음</span>
          <button type="button" class="speed-btn" data-speed="1" aria-pressed="false">느긋이</button>
          <button type="button" class="speed-btn" data-speed="2" aria-pressed="false">천천히</button>
          <button type="button" class="speed-btn" data-speed="3" aria-pressed="true">걷기</button>
          <button type="button" class="speed-btn" data-speed="4" aria-pressed="false">빠르게</button>
          <button type="button" class="speed-btn" data-speed="5" aria-pressed="false">달리기</button>
        </div>
        <label class="time">
          <span class="time-title">시각</span>
          <input type="range" id="time-range" min="0" max="24" step="0.25" value="10.5" aria-label="그곳의 시각" />
          <span class="time-label" id="time-label">오전 10:30</span>
        </label>
        <div class="distance">
          <span class="distance-label" id="distance">0 m 걸음</span>
          <div class="distance-bar"><i id="progress"></i></div>
        </div>
      </div>

      <!-- 우측 불편사항 -->
      <button type="button" class="feedback-tab" id="feedback-tab">불편사항 보내기</button>
      <aside class="feedback-panel" id="feedback-panel" hidden>
        <h3>불편사항을 입력해주세요</h3>
        <p>불편했던 점, 안 되는 것, 바라는 점을 적어 주세요. 운영자(kwoos333@naver.com)에게 전달됩니다.</p>
        <textarea id="fb-text" placeholder="예) 모바일에서 속도 버튼이 가려져요"></textarea>
        <input id="fb-contact" type="text" placeholder="답장 받을 연락처 (선택)" />
        <div class="row">
          <button type="button" class="btn btn-lamp" id="fb-send">보내기</button>
          <a id="fb-mail" href="mailto:kwoos333@naver.com?subject=[Walk%20Anywhere]%20불편사항">메일로 직접 보내기</a>
        </div>
        <p class="status" id="fb-status"></p>
      </aside>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
